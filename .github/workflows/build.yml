# Author: UKARAKAS | Date: 09.11.2026 | Builds the site, tests the PHP API and publishes site.zip
# Every push builds and tests. Pushes to main also update the "guncel-site" release, whose
# site.zip is uploaded to Güzel Hosting by hand:
# https://github.com/karakasugur/aktas-makina/releases/download/guncel-site/site.zip
name: Siteyi derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Tip kontrolü
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Derle
        run: npm run build

      - name: PHP sözdizimi ve dosya kontrolü
        run: |
          for f in dist/api/*.php; do php -l "$f"; done
          for f in dist/.htaccess dist/api/data/.htaccess dist/uploads/.htaccess dist/og-image.jpg dist/robots.txt; do
            test -f "$f" || { echo "Eksik dosya: $f"; exit 1; }
          done

      - name: PHP API testi
        run: bash scripts/smoke-test.sh dist

      - name: Zip hazırla
        run: cd dist && zip -r ../site.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site.zip

      - name: Güncel sürümü yayınla
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete guncel-site --yes --cleanup-tag || true
          gh release create guncel-site site.zip --target "$GITHUB_SHA" --title "Güncel site" \
            --notes "Güzel Hosting'e yüklenecek güncel site. Commit: $GITHUB_SHA"

      # UKARAKAS 09.11.2026 - builds of other branches go to a test release (not for Güzel Hosting)
      - name: Önizleme sürümünü yayınla
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete onizleme --yes --cleanup-tag || true
          gh release create onizleme site.zip --target "$GITHUB_SHA" --prerelease --title "Önizleme ($GITHUB_REF_NAME)" \
            --notes "Sadece test için. Hostinge bunu değil, 'guncel-site' zip'ini yükleyin."
